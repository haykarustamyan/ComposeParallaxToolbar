name: Release

# Push a tag like v2.0.0 to release. The tag must match the version in the module's
# build file and have a section in CHANGELOG.md. Order: verify, publish to Maven
# Central, then create the GitHub release with the changelog section as its notes, so a
# release only appears once the artifact is actually out.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/gradle.yml

  publish:
    name: Publish to Maven Central
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the module version and has changelog notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          declared="$(grep -oE 'version = "[^"]+"' compose-parallax-toolbar-kmp/build.gradle.kts | head -1 | sed 's/version = "//; s/"//')"
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag $TAG but build.gradle.kts declares version $declared"; exit 1
          fi
          if ! grep -qE "^## $version\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          echo "Releasing $version"

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Lines after "## <version>" up to the next "## " heading.
          awk -v v="$version" '
            $0 ~ "^## " v "([^0-9.]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo ""
            echo "Maven Central: \`am.highapps.parallaxtoolbar:compose-parallax-toolbar-kmp:$version\`"
          } >> release-notes.md
          echo "--- notes ---"; cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag $extra
